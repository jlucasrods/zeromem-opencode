[package]
name = "opencode-zeromem-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[dependencies]
built = "=0.8.0"
fastembed = "=5.7.0"
idna = "=1.0.3"
image = "=0.25.9"
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
